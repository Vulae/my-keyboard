[package]
name = "my-keyboard"
version.workspace = true
edition.workspace = true

[dependencies]
openrazer = { path = "../openrazer/" }
anyhow = "1.0.98"
rand = "0.9.1"
signal-hook = "0.3.18"
log = "0.4.27"
env_logger = "0.11.8"
mlua = { git = "https://github.com/mlua-rs/mlua", tag = "v0.12.0-rc.2", features = ["error-send", "macros", "mlua_derive", "lua55", "vendored"] }
clap = { version = "4.6.1", features = ["derive"] }
notify = "8.2.0"
ratatui = "0.30.2"
tui-logger = "0.18.2"
crossterm = "0.29.0"
